<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CGI form pageg" />
    <title>CGI form</title>
    <link rel="stylesheet" href="styles/vars.css" />
    <link rel="stylesheet" href="styles/form.css" />
    <!--
    FLEX PAGE SCAFFOLD
    The body is a flex column at least as tall as the viewport. Header and
    footer take their natural height; main has flex: 1, so it grows to
    absorb the leftover space and pushes the footer to the bottom even
    when the content is short.
  -->
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100svh;

        > header {
          padding: var(--space-2) var(--space-3);
          border-block-end: var(--border);
          background: var(--panel);
        }

        > main {
          flex: 1;
          padding: var(--space-3);
        }

        > footer {
          padding: var(--space-2) var(--space-3);
          border-block-start: var(--border);
          background: var(--panel);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CGI Form</h1>
    </header>

    <main>
      <form id="cgi-form">
      <!-- language -->
      <label for="language">CGI using: </label>
      <select id="language">
        <option value="perl">Perl</option>
        <option value="php">PHP</option>
        <option value="node">Node.js</option>
        <option value="python">Python</option></select
      ><br />

      <!-- message -->
      <label for="name">Enter your name: </label>
      <input type="text" name="name" id="name" /><br /><br />

      <input type="submit" value="Test Sessioning">

      </form>
    </main>

    <footer>
      A simple homepage made with &hearts; by Janeen Taitingfong 2026
    </footer>
  </body>
</html>
